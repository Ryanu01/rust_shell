name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: rush-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: rush-linux-aarch64

          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: rush-macos-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: rush-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install ARM64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/rush.exe ${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/rush ${{ matrix.asset_name }}
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}